name: Daily reservoir reports
on:
  schedule:
    # 06:00, 12:00, 18:00 Asia/Bangkok. GitHub may start later.
    - cron: '0 23,5,11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate sources without publishing
        type: boolean
        default: false
      history_limit:
        description: Reservoirs to backfill this run (0–50)
        type: number
        default: 6
      history_offset:
        description: First reservoir index (blank rotates automatically)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: daily-reservoir-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:reservoirs
      - run: npm run collect:reservoirs
        env:
          DOONAM_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DOONAM_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.history_limit) || '6' }}
          DOONAM_BACKFILL_OFFSET: ${{ inputs.history_offset }}
          DOONAM_INGEST_URL: ${{ vars.DOONAM_INGEST_URL }}
          DOONAM_INGEST_SECRET: ${{ secrets.DOONAM_INGEST_SECRET }}
