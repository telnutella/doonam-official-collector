name: Collect official water bulletins
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate upstream sources without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: official-water-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install pypdf==6.10.0
      - run: npm run collect
        env:
          DOONAM_DDPM_ENABLED: ${{ vars.DOONAM_DDPM_ENABLED || '0' }}
          DOONAM_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NODE_EXTRA_CA_CERTS: certs/globalsign-intermediate.crt
          DOONAM_INGEST_URL: ${{ vars.DOONAM_INGEST_URL }}
          DOONAM_INGEST_SECRET: ${{ secrets.DOONAM_INGEST_SECRET }}
